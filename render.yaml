services:
  - type: web
    name: cineverse-api-shivam
    runtime: node
    rootDir: server
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Values come from server/.env — Render asks for each one when the Blueprint is created
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: AUTH_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

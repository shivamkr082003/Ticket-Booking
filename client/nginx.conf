server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Any path that isn't a real file (e.g. /movies/123, a client-side
    # React Router route) falls back to index.html, letting React Router
    # handle the routing instead of nginx returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively (Vite fingerprints filenames,
    # so a new deploy naturally gets a new filename — safe to cache hard).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
